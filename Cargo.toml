[package]
name = "imageclient"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", default-features = false, features = ["syntect"] }
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
egui_system_font_provider = "0.37"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow", "NSRunningApplication"] }
tray-icon = "0.26.1"
